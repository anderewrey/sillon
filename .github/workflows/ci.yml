name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Les machines GitHub ont déjà un SDK Android : on se contente d'en accepter les licences,
      # et Gradle télécharge lui-même la plateforme manquante.
      - name: Licences du SDK Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Compilation (debug)
        run: ./gradlew assembleDebug --console=plain

      - name: APK debug
        uses: actions/upload-artifact@v4
        with:
          name: sillon-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
